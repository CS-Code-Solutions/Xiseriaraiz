    const getMenu = () => {
      const saved = localStorage.getItem('raiz_menu');
      return saved ? JSON.parse(saved) : defaultMenuCategories;
    };

    const getRefrigBrands = () => {
      const saved = localStorage.getItem('raiz_refrig_brands');
      return saved ? JSON.parse(saved) : ['Coca-Cola', 'Pepsi', 'Fruk'];
    };

    function Home({ setRoute, setTableNumber }) {
      const [adminPassword, setAdminPassword] = useState('');
      const [error, setError] = useState('');

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-[#121212]">

      );
    }

    function ClientMenu({ tableNumber, setRoute }) {
      const [menuData] = useState(getMenu());
      const [refrigBrands, setRefrigBrands] = useState(getRefrigBrands);
      const [cart, setCart] = useState([]);
      const [orderSent, setOrderSent] = useState(false);
      const [showCartModal, setShowCartModal] = useState(false);
      
      const [foodModalItem, setFoodModalItem] = useState(null);
      const [foodModalType, setFoodModalType] = useState('');
      const [selectedAddons, setSelectedAddons] = useState([]);
      const [itemObservation, setItemObservation] = useState('');

      const [drinkModalItem, setDrinkModalItem] = useState(null);
      const [drinkCopos, setDrinkCopos] = useState(1);
      const [drinkGelo, setDrinkGelo] = useState('Com Gelo');
      const [drinkLimao, setDrinkLimao] = useState('Com Limão');
      const [drinkOpcao, setDrinkOpcao] = useState(refrigBrands[0] || 'Coca-Cola');

      const handleOpenItem = (item, catIdName) => {
        if (catIdName === 'xis' || catIdName === 'mini-xis') { setFoodModalType('xis'); setFoodModalItem(item); setSelectedAddons([]); setItemObservation(''); }
        else if (catIdName === 'hot-dog') { setFoodModalType('hotdog'); setFoodModalItem(item); setSelectedAddons([]); setItemObservation(''); }
        else if (catIdName === 'bebidas') {
          if (item.name.toLowerCase().includes('refri')) {
            setDrinkModalItem(item); setDrinkOpcao(refrigBrands[0] || 'Coca-Cola'); setDrinkCopos(1); setDrinkGelo('Com Gelo'); setDrinkLimao('Com Limão');
          } else if (item.name.toLowerCase().includes('água')) {
            setDrinkModalItem(item); setDrinkOpcao('Com Gás'); setDrinkCopos(1); setDrinkGelo('Com Gelo'); setDrinkLimao('Com Limão');
          } else {
            setCart([...cart, { ...item, cartId: Date.now(), adicionais: [], observation: '' }]);
          }
        }
        else { setCart([...cart, { ...item, cartId: Date.now(), adicionais: [], observation: '' }]); }
      };

      const toggleAddon = (addon) => {
        if (selectedAddons.find(a => a.id === addon.id)) setSelectedAddons(selectedAddons.filter(a => a.id !== addon.id));
        else setSelectedAddons([...selectedAddons, addon]);
      };

      const confirmFoodToCart = () => { setCart([...cart, { ...foodModalItem, cartId: Date.now(), adicionais: selectedAddons, observation: itemObservation }]); setFoodModalItem(null); };
      
      const confirmDrinkToCart = () => {
        let obsText = '';
        if (drinkModalItem.name.toLowerCase().includes('refri') || drinkModalItem.name.toLowerCase().includes('água')) {
          obsText = `${drinkOpcao}, ${drinkCopos} copo(s), ${drinkGelo}, ${drinkLimao}`;
        }
        setCart([...cart, { ...drinkModalItem, cartId: Date.now(), adicionais: [], observation: obsText }]);
        setDrinkModalItem(null);
      };

      const removeFromCart = (cartId) => setCart(cart.filter(item => item.cartId !== cartId));
      const getItemTotal = (item) => item.price + (item.adicionais ? item.adicionais.reduce((sum, add) => sum + add.price, 0) : 0);
      const getCartTotal = () => cart.reduce((total, item) => total + getItemTotal(item), 0);

      const sendOrder = () => {
        if (cart.length === 0) return;
        const newOrder = { id: Math.random().toString(36).substr(2, 5).toUpperCase(), table: tableNumber, items: cart, timestamp: Date.now(), date: new Date().toISOString().split('T')[0], status: 'pendente', pagamento: 'pendente' };
        const existingOrders = JSON.parse(localStorage.getItem('raiz_orders')) || [];
        localStorage.setItem('raiz_orders', JSON.stringify([...existingOrders, newOrder]));
        setShowCartModal(false); setOrderSent(true); setCart([]);
      };

      const scrollToCategory = (idName) => { const el = document.getElementById(`cat-${idName}`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

      if (orderSent) return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#121212]">
          <div className="bg-green-600 p-6 rounded-full mb-6"><IconCheck /></div>
          <h2 className="text-3xl font-bold mb-2 text-white">Pedido Enviado!</h2>
          <p className="text-gray-400 mb-8">A cozinha já está a preparar o seu pedido.</p>
          <button onClick={() => setOrderSent(false)} className="bg-[#d32f2f] px-8 py-3 rounded-lg font-bold text-white">Novo pedido</button>
        </div>
      );

      return (
        <div className="pb-24 bg-[#121212]">
          <div className="sticky top-0 z-30 bg-[#1a1a1a] shadow-lg border-b border-red-900">
            <header className="p-3 flex justify-between items-center">
              <div className="flex items-center gap-3">
                <button onClick={() => setRoute('home')} className="text-gray-400 hover:text-white transition-colors"><IconArrowLeft /></button>
                <div className="flex items-center gap-2">
                  <img src="./Logo.png" alt="RAIZ" className="h-10 object-contain" onError={handleImageError} />
                  <div style={{ display: 'none' }}><h1 className="text-lg font-black text-[#d32f2f]">RAIZ</h1></div>
                </div>
              </div>
              <div className="bg-[#2a2a2a] border border-gray-700 px-4 py-1.5 rounded-xl shadow-inner"><span className="text-gray-400 text-xs uppercase tracking-wider block text-right">Local</span><span className="text-[#d32f2f] font-black text-base">Mesa {tableNumber}</span></div>
            </header>
            <div className="flex overflow-x-auto py-3 px-4 gap-2 bg-[#121212] border-t border-gray-800 scrollbar-hide shadow-md">
              {menuData.map((cat, idx) => ( <button key={idx} onClick={() => scrollToCategory(cat.idName)} className="whitespace-nowrap bg-[#2a2a2a] hover:bg-[#d32f2f] text-gray-200 hover:text-white px-4 py-2 rounded-full text-sm font-bold transition-colors">{cat.title}</button> ))}
            </div>
          </div>

          <div className="p-4 space-y-8 max-w-2xl mx-auto pt-6">
            {menuData.map((cat, idx) => (
              <div key={idx} id={`cat-${cat.idName}`} className="scroll-mt-32">
                <h2 className="text-xl font-bold border-b-2 border-[#d32f2f] pb-2 mb-4 text-white uppercase tracking-wide">{cat.title}</h2>
                <div className="space-y-4">
                  {cat.items.map(item => (
                    <div key={item.id} className="bg-[#1e1e1e] p-4 rounded-xl flex justify-between items-center shadow-lg border border-transparent hover:border-gray-700 transition-colors">
                      <div className="flex-1 pr-4">
                        <h3 className="font-bold text-lg leading-tight text-white">{item.name}</h3>
                        {item.desc && <p className="text-gray-400 text-xs mt-1 leading-snug">{item.desc}</p>}
                        <p className="text-[#d32f2f] font-bold mt-2 text-lg">R$ {Number(item.price).toFixed(2)}</p>
                      </div>
                      <button onClick={() => handleOpenItem(item, cat.idName)} className="bg-[#2a2a2a] text-white hover:bg-[#d32f2f] p-3 rounded-lg transition-colors"><IconPlus /></button>
                    </div>
                  ))}
                </div>
              </div>
            ))}

          {foodModalItem && (

              <div className="bg-[#1e1e1e] w-full max-w-md rounded-2xl p-6 shadow-2xl max-h-[80vh] overflow-y-auto border border-gray-800 flex flex-col">
                <div className="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
                  <div><h3 className="text-xl font-bold text-[#d32f2f]">{foodModalItem.name}</h3><p className="text-gray-400 text-sm">Personalize seu pedido</p></div>
                  <button onClick={() => setFoodModalItem(null)} className="text-gray-500 hover:text-white text-3xl leading-none">&times;</button>
                </div>
                <div className="space-y-3 mb-6 flex-1">
                  <h4 className="text-white font-bold text-sm mb-2">Adicionais (+ R$)</h4>
                  {(foodModalType === 'xis' ? xisAddonItems : hotdogAddonItems).map(addon => (
                    <label key={addon.id} className="flex items-center justify-between bg-[#2a2a2a] p-3 rounded-lg cursor-pointer hover:bg-[#333] transition-colors">
                      <div className="flex items-center gap-3"><input type="checkbox" className="w-5 h-5 accent-[#d32f2f]" checked={!!selectedAddons.find(a => a.id === addon.id)} onChange={() => toggleAddon(addon)} /><span className="font-bold text-white">{addon.name}</span></div>
                      <span className="text-[#d32f2f] font-bold">+ R$ {addon.price.toFixed(2)}</span>
                    </label>
                  ))}
                </div>
                <div className="border-t border-gray-700 pt-4 mb-6">
                  <h4 className="text-white font-bold text-sm mb-2">Observações</h4>
                  <textarea className="w-full bg-[#121212] text-white border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-[#d32f2f]" rows="2" placeholder="Ex: Sem milho..." value={itemObservation} onChange={(e) => setItemObservation(e.target.value)}></textarea>
                </div>
                <button onClick={confirmFoodToCart} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl text-lg transition-colors mt-auto">Confirmar e Adicionar</button>
              </div>
            </div>
          )}

          {drinkModalItem && (

              <div className="bg-[#1e1e1e] w-full max-w-md rounded-2xl p-6 shadow-2xl border border-gray-800 flex flex-col">
                <div className="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
                  <div><h3 className="text-xl font-bold text-[#d32f2f]">{drinkModalItem.name}</h3></div>
                  <button onClick={() => setDrinkModalItem(null)} className="text-gray-500 hover:text-white text-3xl leading-none">&times;</button>
                </div>
                
                <div className="space-y-4 mb-6">
                  <div>
                    <label className="text-gray-300 font-bold text-sm block mb-2">
                      {drinkModalItem.name.toLowerCase().includes('refri') ? 'Marca:' : 'Tipo:'}
                    </label>
                    <div className="grid grid-cols-3 gap-2">
                      {drinkModalItem.name.toLowerCase().includes('refri') ? 
                        refrigBrands.map(m => ( <button key={m} onClick={() => setDrinkOpcao(m)} className={`py-2 rounded-lg font-bold transition-colors text-xs ${drinkOpcao === m ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{m}</button> ))
                        :
                        ['Com Gás', 'Sem Gás'].map(opt => ( <button key={opt} onClick={() => setDrinkOpcao(opt)} className={`py-2 rounded-lg font-bold transition-colors text-xs ${drinkOpcao === opt ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{opt}</button> ))
                      }
                    </div>
                  </div>
                  <div>
                    <label className="text-gray-300 font-bold text-sm block mb-2">Copos:</label>
                    <div className="flex gap-2">{[1, 2, 3, 4].map(num => ( <button key={num} onClick={() => setDrinkCopos(num)} className={`flex-1 py-2 rounded-lg font-bold transition-colors text-xs ${drinkCopos === num ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{num}</button> ))}</div>
                  </div>
                  <div>
                    <label className="text-gray-300 font-bold text-sm block mb-2">Gelo:</label>
                    <div className="flex gap-2">{['Com Gelo', 'Sem Gelo'].map(opt => ( <button key={opt} onClick={() => setDrinkGelo(opt)} className={`flex-1 py-2 rounded-lg font-bold transition-colors text-xs ${drinkGelo === opt ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{opt}</button> ))}</div>
                  </div>
                  <div>
                    <label className="text-gray-300 font-bold text-sm block mb-2">Limão:</label>
                    <div className="flex gap-2">{['Com Limão', 'Sem Limão'].map(opt => ( <button key={opt} onClick={() => setDrinkLimao(opt)} className={`flex-1 py-2 rounded-lg font-bold transition-colors text-xs ${drinkLimao === opt ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{opt}</button> ))}</div>
                  </div>
                </div>

                <button onClick={confirmDrinkToCart} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl text-lg">Adicionar</button>
              </div>
            </div>
          )}

          {showCartModal && (
            <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
              <div className="bg-[#1e1e1e] w-full max-w-lg rounded-2xl p-6 shadow-2xl max-h-[85vh] overflow-y-auto border border-gray-800 flex flex-col">
                <div className="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
                  <div><h3 className="text-2xl font-black text-white">Seu Carrinho</h3></div>
                  <button onClick={() => setShowCartModal(false)} className="text-gray-500 hover:text-white text-3xl leading-none">&times;</button>
                </div>
                <div className="space-y-4 mb-6 flex-1 overflow-y-auto pr-1">
                  {cart.length === 0 ? <p className="text-center text-gray-500 py-6">O seu carrinho está vazio.</p> : 
                    cart.map(item => (
                      <div key={item.cartId} className="bg-[#2a2a2a] p-4 rounded-xl flex justify-between items-start border border-gray-700">
                        <div className="flex-1 pr-3">
                          <h4 className="font-bold text-lg text-white">{item.name}</h4>
                          <p className="text-[#d32f2f] font-bold">R$ {getItemTotal(item).toFixed(2)}</p>
                          {item.adicionais && item.adicionais.length > 0 && <div className="mt-1 text-sm text-gray-300">{item.adicionais.map((add, idx) => <p key={idx}>+ {add.name} (R$ {add.price.toFixed(2)})</p>)}</div>}
                          {item.observation && <p className="text-sm text-yellow-400 mt-1 italic font-bold">Obs: {item.observation}</p>}
                        </div>
                        <button onClick={() => removeFromCart(item.cartId)} className="text-red-400 p-2"><IconTrash /></button>
                      </div>
                    ))
                  }
                </div>
                {cart.length > 0 && (
                  <div className="border-t border-gray-700 pt-4 mt-auto">
                    <div className="flex justify-between items-center mb-4"><span className="text-gray-400 font-bold">Total do Pedido:</span><span className="text-2xl font-black text-white">R$ {getCartTotal().toFixed(2)}</span></div>
                    <button onClick={sendOrder} className="w-full bg-[#d32f2f] hover:bg-red-700 text-white font-bold py-4 rounded-xl text-lg flex items-center justify-center gap-2"><IconCart /> Enviar Pedido</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {cart.length > 0 && (
            <div className="fixed bottom-0 w-full bg-[#1e1e1e] p-4 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-20 border-t border-gray-800">
              <div className="max-w-2xl mx-auto flex justify-between items-center">
                <div><p className="text-gray-400 text-sm">{cart.length} item(s)</p><p className="font-bold text-xl text-white">R$ {getCartTotal().toFixed(2)}</p></div>
                <button onClick={() => setShowCartModal(true)} className="bg-[#d32f2f] px-6 py-3 rounded-xl font-bold flex gap-2"><IconCart /> Ver Carrinho</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AdminPanel({ setRoute }) {
      const [activeTab, setActiveTab] = useState('pedidos');
      const [orders, setOrders] = useState([]);
      const [now, setNow] = useState(Date.now());
      const [tables, setTables] = useState(() => JSON.parse(localStorage.getItem('raiz_tables')) || []);
      const [newTableNumber, setNewTableNumber] = useState('');
      const [menuData, setMenuData] = useState(getMenu());
      const [refrigBrands, setRefrigBrands] = useState(getRefrigBrands);
      const [newBrandName, setNewBrandName] = useState('');
      const [editItem, setEditItem] = useState(null);
      const [historyDate, setHistoryDate] = useState(new Date().toISOString().split('T')[0]);

      const [cashFilter, setCashFilter] = useState('');
      const [selectedOrderToPay, setSelectedOrderToPay] = useState(null);

      const [wTable, setWTable] = useState('');
      const [wCart, setWCart] = useState([]);
      const [showWCart, setShowWCart] = useState(false);
      const [wFoodModal, setWFoodModal] = useState(null);
      const [wFoodType, setWFoodType] = useState('');
      const [wAddons, setWAddons] = useState([]);
      const [wObs, setWObs] = useState('');
      
      const [wDrinkModal, setWDrinkModal] = useState(null);
      const [wCopos, setWCopos] = useState(1);
      const [wGelo, setWGelo] = useState('Com Gelo');
      const [wLimao, setWLimao] = useState('Com Limão');
      const [wOpcao, setWOpcao] = useState(refrigBrands[0] || 'Coca-Cola');

      useEffect(() => {
        const timer = setInterval(() => { setNow(Date.now()); setOrders(JSON.parse(localStorage.getItem('raiz_orders')) || []); }, 1000);
        return () => clearInterval(timer);
      }, []);

      const pendingOrders = orders.filter(o => o.status === 'pendente');
      const historyOrders = orders.filter(o => o.status === 'concluido' && o.date === historyDate);
      
      const caixaOrders = orders.filter(o => o.pagamento === 'pendente' || !o.pagamento);
      const filteredCaixaOrders = caixaOrders.filter(o => {
        if (!cashFilter) return true;
        return String(o.table).toLowerCase().includes(cashFilter.toLowerCase());
      });

      const completeOrder = (id) => {
        const updated = (JSON.parse(localStorage.getItem('raiz_orders')) || []).map(o => {
          if (o.id === id) {
            return { ...o, status: 'concluido' };
          }
          return o;
        });
        localStorage.setItem('raiz_orders', JSON.stringify(updated));
        setOrders(updated);
      };

      const payOrder = (id) => {
        const updated = (JSON.parse(localStorage.getItem('raiz_orders')) || []).map(o => {
          if (o.id === id) {
            return { ...o, pagamento: 'realizado' };
          }
          return o;
        });
        localStorage.setItem('raiz_orders', JSON.stringify(updated));
        setOrders(updated);
        setSelectedOrderToPay(null);
      };

      const getTime = (ts) => { const diff = Math.floor((now - ts) / 1000); return `${Math.floor(diff / 60).toString().padStart(2, '0')}:${(diff % 60).toString().padStart(2, '0')}`; };

      const downloadQR = (tableNum, url) => {
        fetch(`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(url)}`).then(res => res.blob()).then(blob => {
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `QR_Mesa_${tableNum}.png`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        });
      };

      const handleAddTable = () => {
        if (!newTableNumber) return;
        const updated = [...tables, { number: newTableNumber, url: `${window.location.origin}${window.location.pathname}?mesa=${newTableNumber}` }];
        setTables(updated); localStorage.setItem('raiz_tables', JSON.stringify(updated)); setNewTableNumber('');
      };
      const handleDeleteTable = (num) => { const updated = tables.filter(t => t.number !== num); setTables(updated); localStorage.setItem('raiz_tables', JSON.stringify(updated)); };
      const saveProductEdit = () => { const newMenu = [...menuData]; newMenu[editItem.catIdx].items[editItem.itemIdx] = editItem.data; setMenuData(newMenu); localStorage.setItem('raiz_menu', JSON.stringify(newMenu)); setEditItem(null); };

      const handleAddBrand = () => {
        if (!newBrandName.trim()) return;
        const updated = [...refrigBrands, newBrandName.trim()];
        setRefrigBrands(updated);
        localStorage.setItem('raiz_refrig_brands', JSON.stringify(updated));
        setNewBrandName('');
      };

      const handleDeleteBrand = (brandName) => {
        const updated = refrigBrands.filter(b => b !== brandName);
        setRefrigBrands(updated);
        localStorage.setItem('raiz_refrig_brands', JSON.stringify(updated));
      };

      const handleOpenWItem = (item, catIdName) => {
        if (catIdName === 'xis' || catIdName === 'mini-xis') { setWFoodType('xis'); setWFoodModal(item); setWAddons([]); setWObs(''); }
        else if (catIdName === 'hot-dog') { setWFoodType('hotdog'); setWFoodModal(item); setWAddons([]); setWObs(''); }
        else if (catIdName === 'bebidas') {
          if (item.name.toLowerCase().includes('refri')) {
            setWDrinkModal(item); setWOpcao(refrigBrands[0] || 'Coca-Cola'); setWCopos(1); setWGelo('Com Gelo'); setWLimao('Com Limão');
          } else if (item.name.toLowerCase().includes('água')) {
            setWDrinkModal(item); setWOpcao('Com Gás'); setWCopos(1); setWGelo('Com Gelo'); setWLimao('Com Limão');
          } else {
            setWCart([...wCart, { ...item, cartId: Date.now(), adicionais: [], observation: '' }]);
          }
        }
        else { setWCart([...wCart, { ...item, cartId: Date.now(), adicionais: [], observation: '' }]); }
      };

      const toggleWAddon = (addon) => { if (wAddons.find(a => a.id === addon.id)) setWAddons(wAddons.filter(a => a.id !== addon.id)); else setWAddons([...wAddons, addon]); };
      const confirmWFoodToCart = () => { setWCart([...wCart, { ...wFoodModal, cartId: Date.now(), adicionais: wAddons, observation: wObs }]); setWFoodModal(null); };
      
      const confirmWDrinkToCart = () => {
        let obsText = '';
        if (wDrinkModal.name.toLowerCase().includes('refri') || wDrinkModal.name.toLowerCase().includes('água')) {
          obsText = `${wOpcao}, ${wCopos} copo(s), ${wGelo}, ${wLimao}`;
        }
        setWCart([...wCart, { ...wDrinkModal, cartId: Date.now(), adicionais: [], observation: obsText }]);
        setWDrinkModal(null);
      };

      const removeWCart = (cartId) => setWCart(wCart.filter(item => item.cartId !== cartId));
      
      const getOrderItemTotal = (item) => item.price + (item.adicionais ? item.adicionais.reduce((sum, add) => sum + add.price, 0) : 0);
      const getOrderTotal = (items) => items.reduce((total, item) => total + getOrderItemTotal(item), 0);

      const sendWOrder = () => {
        if (!wTable) { alert("Selecione a mesa ou balcão."); return; }
        if (wCart.length === 0) return;
        const newOrder = { id: Math.random().toString(36).substr(2, 5).toUpperCase(), table: wTable, items: wCart, timestamp: Date.now(), date: new Date().toISOString().split('T')[0], status: 'pendente', pagamento: 'pendente' };
        const existing = JSON.parse(localStorage.getItem('raiz_orders')) || [];
        localStorage.setItem('raiz_orders', JSON.stringify([...existing, newOrder])); setOrders([...existing, newOrder]);
        setWCart([]); setWTable(''); setShowWCart(false); setActiveTab('pedidos');
      };

      return (
        <div className="pb-24 p-6 min-h-screen bg-[#121212]">
          <header className="flex justify-between items-center mb-6 bg-[#1e1e1e] p-4 rounded-xl">
            <button onClick={() => setRoute('home')} className="text-gray-400 hover:text-white"><IconArrowLeft /></button>
            <h1 className="text-2xl font-black text-white">PAINEL RAIZ</h1>
            <div className="bg-[#d32f2f] px-3 py-1 rounded-full text-xs font-bold animate-pulse text-white">Ativo</div>
          </header>

          {activeTab === 'pedidos' && (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {pendingOrders.length === 0 ? <p className="col-span-full text-center text-gray-500 mt-10 text-xl">Cozinha tranquila. Nenhum pedido na fila.</p> : 
                pendingOrders.map(order => (
                  <div key={order.id} className="bg-[#1e1e1e] border-l-4 border-[#d32f2f] rounded-xl p-5 shadow-xl flex flex-col">
                    <div className="flex justify-between border-b border-gray-700 pb-3 mb-3">
                      <div>
                        <h2 className="text-2xl font-black text-white">{order.table === 'Balcão' ? 'Balcão' : `Mesa ${order.table}`}</h2>
                        <p className="text-gray-400 text-sm">#{order.id}</p>
                      </div>
                      <div className="flex flex-col items-end gap-1">
                        <div className="bg-[#2a2a2a] text-[#d32f2f] px-3 py-1 rounded-lg text-lg font-bold flex items-center gap-2"><IconClock /> {getTime(order.timestamp)}</div>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${order.pagamento === 'realizado' ? 'bg-green-900/40 text-green-400 border border-green-700' : 'bg-yellow-900/40 text-yellow-400 border border-yellow-700'}`}>
                          {order.pagamento === 'realizado' ? 'Pago' : 'Não Pago'}
                        </span>
                      </div>
                    </div>
                    <div className="flex-1 space-y-4 mb-4">
                      {order.items.map((item, i) => (
                        <div key={i} className="text-white border-b border-gray-800 pb-2 last:border-0">
                          <p className="font-bold text-lg">• 1x {item.name}</p>
                          {item.adicionais && item.adicionais.length > 0 && <div className="mt-1">{item.adicionais.map((add, idx) => <p key={idx} className="text-sm text-gray-400 pl-4">+ {add.name}</p>)}</div>}
                          {item.observation && <p className="text-sm text-yellow-500 pl-4 mt-1 font-bold italic">Obs: {item.observation}</p>}
                        </div>
                      ))}
                    </div>
                    <button onClick={() => completeOrder(order.id)} className="w-full bg-green-600 hover:bg-green-500 py-4 rounded-lg font-bold flex justify-center gap-2 text-lg text-white mt-auto"><IconCheckCircle /> Entregar</button>
                  </div>
                ))
              }
            </div>
          )}

          {activeTab === 'caixa' && (
            <div className="max-w-4xl mx-auto pb-10">
              <div className="flex flex-col sm:flex-row justify-between items-center mb-6 bg-[#1e1e1e] p-4 rounded-xl border border-gray-700 gap-4">

                  <h2 className="text-xl font-bold text-white">Caixa & Pagamentos</h2>
                  <p className="text-xs text-gray-400">Digite o número da mesa para filtrar instantaneamente</p>
                </div>
                <div className="w-full sm:w-64">
                  <input type="text" placeholder="Filtrar por mesa (ex: 3, 33...)" value={cashFilter} onChange={e => setCashFilter(e.target.value)} className="w-full bg-[#121212] text-white border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-[#d32f2f] font-bold" />
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filteredCaixaOrders.length === 0 ? <p className="col-span-full text-center text-gray-500 py-10">Nenhum pedido pendente de pagamento encontrado.</p> :
                  filteredCaixaOrders.map(order => (
                    <div key={order.id} onClick={() => setSelectedOrderToPay(order)} className="bg-[#1e1e1e] p-5 rounded-xl border border-gray-700 hover:border-[#d32f2f] cursor-pointer transition-all shadow-lg flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-start mb-3">
                          <div>
                            <h3 className="text-2xl font-black text-white">{order.table === 'Balcão' ? 'Balcão' : `Mesa ${order.table}`}</h3>
                            <p className="text-xs text-gray-400">Pedido #{order.id} • {new Date(order.timestamp).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</p>
                          </div>
                          <span className="bg-yellow-500/20 text-yellow-400 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider border border-yellow-500/30">Pagamento Pendente</span>
                        </div>
                        <div className="space-y-1 mb-4">
                          <p className="text-sm text-gray-300 font-bold">{order.items.length} item(s) no pedido</p>
                          {order.items.map((item, idx) => (
                            <p key={idx} className="text-xs text-gray-400 truncate">• 1x {item.name}</p>
                          ))}
                        </div>
                      </div>
                      <div className="pt-3 border-t border-gray-800 flex justify-between items-center">
                        <span className="text-gray-400 text-sm font-bold">Total a Pagar:</span>
                        <span className="text-2xl font-black text-green-400">R$ {getOrderTotal(order.items).toFixed(2)}</span>
                      </div>
                    </div>
                  ))
                }
              </div>

              {selectedOrderToPay && (
                <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
                  <div className="bg-[#1e1e1e] w-full max-w-lg rounded-2xl p-6 shadow-2xl max-h-[85vh] overflow-y-auto border border-gray-700 flex flex-col">
                    <div className="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
                      <div>
                        <h3 className="text-2xl font-black text-white">{selectedOrderToPay.table === 'Balcão' ? 'Balcão' : `Mesa ${selectedOrderToPay.table}`}</h3>

                      <button onClick={() => setSelectedOrderToPay(null)} className="text-gray-500 hover:text-white text-3xl leading-none">&times;</button>

                      {selectedOrderToPay.items.map((item, i) => (

                          <div className="flex justify-between font-bold text-white text-lg">
                            <span>1x {item.name}</span>
                            <span className="text-[#d32f2f]">R$ {getOrderItemTotal(item).toFixed(2)}</span>
                          </div>
                          {item.adicionais && item.adicionais.length > 0 && (
                            <div className="mt-1 text-sm text-gray-300">
                              {item.adicionais.map((add, idx) => <p key={idx}>+ {add.name} (R$ {add.price.toFixed(2)})</p>)}

                          )}
                          {item.observation && <p className="text-sm text-yellow-400 mt-1 italic font-bold">Obs: {item.observation}</p>}
                        </div>
                      ))}
                    </div>

                    <div className="border-t border-gray-700 pt-4 mt-auto">
                      <div className="flex justify-between items-center mb-6">
                        <span className="text-gray-300 font-bold text-lg">Valor Total:</span>
                        <span className="text-3xl font-black text-green-400">R$ {getOrderTotal(selectedOrderToPay.items).toFixed(2)}</span>
                      </div>
                      <button onClick={() => payOrder(selectedOrderToPay.id)} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl text-lg flex items-center justify-center gap-2 shadow-lg transition-colors">
                        <IconCash /> Pagamento Realizado
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {activeTab === 'novo-pedido' && (
            <div className="max-w-2xl mx-auto pb-10">
              <h2 className="text-xl font-bold border-b border-gray-700 pb-2 mb-4 text-white">Lançar Novo Pedido (Garçom)</h2>
              <div className="mb-6 bg-[#1e1e1e] p-4 rounded-xl border border-gray-700">
                <label className="text-gray-400 font-bold mb-2 block text-sm">Selecione a Mesa / Cliente</label>
                <select value={wTable} onChange={e => setWTable(e.target.value)} className="w-full bg-[#121212] border border-gray-700 p-3 rounded-lg text-white focus:border-[#d32f2f] focus:outline-none">
                  <option value="">-- Escolha uma opção --</option><option value="Balcão">Balcão / Viagem</option>
                  {tables.map(t => <option key={t.number} value={t.number}>Mesa {t.number}</option>)}
                </select>
              </div>
              <div className="space-y-6">
                {menuData.map((cat, idx) => (
                  <div key={idx}><h3 className="text-lg font-bold text-[#d32f2f] mb-3 uppercase tracking-wide">{cat.title}</h3>
                    <div className="space-y-3">
                      {cat.items.map(item => (
                        <div key={item.id} className="bg-[#1e1e1e] p-3 rounded-xl flex justify-between items-center border border-gray-800">
                          <div className="flex-1 pr-3"><h4 className="font-bold text-white text-base">{item.name}</h4><p className="text-[#d32f2f] font-bold text-sm">R$ {Number(item.price).toFixed(2)}</p></div>
                          <button onClick={() => handleOpenWItem(item, cat.idName)} className="bg-[#2a2a2a] text-white hover:bg-[#d32f2f] p-2 rounded-lg transition-colors"><IconPlus /></button>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              
              {wFoodModal && (
                <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
                  <div className="bg-[#1e1e1e] w-full max-w-md rounded-2xl p-6 shadow-2xl max-h-[80vh] overflow-y-auto border border-gray-800 flex flex-col">
                    <div className="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
                      <div><h3 className="text-xl font-bold text-[#d32f2f]">{wFoodModal.name}</h3></div><button onClick={() => setWFoodModal(null)} className="text-gray-500 hover:text-white text-3xl leading-none">&times;</button>
                    </div>
                    <div className="space-y-3 mb-6 flex-1">
                      <h4 className="text-white font-bold text-sm mb-2">Adicionais (+ R$)</h4>
                      {(wFoodType === 'xis' ? xisAddonItems : hotdogAddonItems).map(addon => (
                        <label key={addon.id} className="flex items-center justify-between bg-[#2a2a2a] p-3 rounded-lg cursor-pointer hover:bg-[#333]">
                          <div className="flex items-center gap-3"><input type="checkbox" className="w-5 h-5 accent-[#d32f2f]" checked={!!wAddons.find(a => a.id === addon.id)} onChange={() => toggleWAddon(addon)} /><span className="font-bold text-white">{addon.name}</span></div>
                          <span className="text-[#d32f2f] font-bold">+ R$ {addon.price.toFixed(2)}</span>
                        </label>
                      ))}
                    </div>
                    <div className="border-t border-gray-700 pt-4 mb-6">
                      <h4 className="text-white font-bold text-sm mb-2">Observações</h4>
                      <textarea className="w-full bg-[#121212] text-white border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-[#d32f2f]" rows="2" placeholder="Ex: Sem milho..." value={wObs} onChange={(e) => setWObs(e.target.value)}></textarea>
                    </div>
                    <button onClick={confirmWFoodToCart} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl text-lg mt-auto">Adicionar</button>
                  </div>
                </div>
              )}

              {wDrinkModal && (
                <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
                  <div className="bg-[#1e1e1e] w-full max-w-md rounded-2xl p-6 shadow-2xl border border-gray-800 flex flex-col">
                    <div className="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
                      <div><h3 className="text-xl font-bold text-[#d32f2f]">{wDrinkModal.name}</h3></div><button onClick={() => setWDrinkModal(null)} className="text-gray-500 hover:text-white text-3xl leading-none">&times;</button>
                    </div>

                    <div className="space-y-4 mb-6">
                      <div>
                        <label className="text-gray-300 font-bold text-sm block mb-2">
                          {wDrinkModal.name.toLowerCase().includes('refri') ? 'Marca:' : 'Tipo:'}
                        </label>
                        <div className="grid grid-cols-3 gap-2">
                          {wDrinkModal.name.toLowerCase().includes('refri') ? 
                            refrigBrands.map(m => ( <button key={m} onClick={() => setWOpcao(m)} className={`py-2 rounded-lg font-bold transition-colors text-xs ${wOpcao === m ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{m}</button> ))
                            :
                            ['Com Gás', 'Sem Gás'].map(opt => ( <button key={opt} onClick={() => setWOpcao(opt)} className={`py-2 rounded-lg font-bold transition-colors text-xs ${wOpcao === opt ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{opt}</button> ))
                          }
                        </div>
                      </div>
                      <div>
                        <label className="text-gray-300 font-bold text-sm block mb-2">Copos:</label>
                        <div className="flex gap-2">{[1, 2, 3, 4].map(num => ( <button key={num} onClick={() => setWCopos(num)} className={`flex-1 py-2 rounded-lg font-bold text-xs ${wCopos === num ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{num}</button> ))}</div>
                      </div>
                      <div>
                        <label className="text-gray-300 font-bold text-sm block mb-2">Gelo:</label>
                        <div className="flex gap-2">{['Com Gelo', 'Sem Gelo'].map(opt => ( <button key={opt} onClick={() => setWGelo(opt)} className={`flex-1 py-2 rounded-lg font-bold text-xs ${wGelo === opt ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{opt}</button> ))}</div>
                      </div>
                      <div>
                        <label className="text-gray-300 font-bold text-sm block mb-2">Limão:</label>
                        <div className="flex gap-2">{['Com Limão', 'Sem Limão'].map(opt => ( <button key={opt} onClick={() => setWLimao(opt)} className={`flex-1 py-2 rounded-lg font-bold text-xs ${wLimao === opt ? 'bg-[#d32f2f] text-white' : 'bg-[#2a2a2a] text-gray-300'}`}>{opt}</button> ))}</div>
                      </div>
                    </div>

                    <button onClick={confirmWDrinkToCart} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl text-lg">Adicionar</button>
                  </div>
                </div>
              )}

              {showWCart && (
                <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
                  <div className="bg-[#1e1e1e] w-full max-w-lg rounded-2xl p-6 shadow-2xl max-h-[85vh] overflow-y-auto border border-gray-800 flex flex-col">
                    <div className="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
                      <div><h3 className="text-2xl font-black text-white">Resumo do Pedido</h3><p className="text-[#d32f2f] font-bold">{wTable === 'Balcão' ? 'Balcão' : `Mesa ${wTable}`}</p></div>
                      <button onClick={() => setShowWCart(false)} className="text-gray-500 hover:text-white text-3xl leading-none">&times;</button>
                    </div>
                    <div className="space-y-4 mb-6 flex-1 overflow-y-auto pr-1">
                      {wCart.length === 0 ? <p className="text-center text-gray-500 py-6">Carrinho vazio.</p> : 
                        wCart.map(item => (
                          <div key={item.cartId} className="bg-[#2a2a2a] p-4 rounded-xl flex justify-between items-start border border-gray-700">
                            <div className="flex-1 pr-3"><h4 className="font-bold text-lg text-white">{item.name}</h4><p className="text-[#d32f2f] font-bold">R$ {getOrderItemTotal(item).toFixed(2)}</p>
                              {item.adicionais && item.adicionais.length > 0 && <div className="mt-1 text-sm text-gray-300">{item.adicionais.map((add, idx) => <p key={idx}>+ {add.name}</p>)}</div>}
                              {item.observation && <p className="text-sm text-yellow-400 mt-1 italic font-bold">Obs: {item.observation}</p>}
                            </div>
                            <button onClick={() => removeWCart(item.cartId)} className="text-red-400 p-2"><IconTrash /></button>
                          </div>
                        ))
                      }
                    </div>
                    {wCart.length > 0 && (
                      <div className="border-t border-gray-700 pt-4 mt-auto">
                        <div className="flex justify-between items-center mb-4"><span className="text-gray-400 font-bold">Total:</span><span className="text-2xl font-black text-white">R$ {getOrderTotal(wCart).toFixed(2)}</span></div>
                        <button onClick={sendWOrder} className="w-full bg-[#d32f2f] hover:bg-red-700 text-white font-bold py-4 rounded-xl text-lg flex items-center justify-center gap-2"><IconCart /> Mandar p/ Cozinha</button>
                      </div>
                    )}
                  </div>
                </div>
              )}
              
              {wCart.length > 0 && (
                <div className="fixed bottom-[70px] left-0 w-full bg-[#1e1e1e] p-4 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-20 border-t border-gray-800">
                  <div className="max-w-2xl mx-auto flex justify-between items-center">
                    <div><p className="text-gray-400 text-sm">{wCart.length} item(s)</p><p className="font-bold text-xl text-white">R$ {getOrderTotal(wCart).toFixed(2)}</p></div>
                    <button onClick={() => setShowWCart(true)} className="bg-[#d32f2f] px-6 py-3 rounded-xl font-bold flex gap-2"><IconCart /> Revisar Pedido</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {activeTab === 'historico' && (
            <div className="max-w-3xl mx-auto bg-[#1e1e1e] p-6 rounded-xl">
              <div className="flex justify-between items-center border-b border-gray-700 pb-4 mb-6">
                <h2 className="text-xl font-bold text-white">Histórico de Vendas</h2>
                <input type="date" value={historyDate} onChange={e => setHistoryDate(e.target.value)} className="bg-[#121212] text-white border border-gray-700 p-2 rounded-lg focus:outline-none focus:border-[#d32f2f]" />
              </div>
              <div className="space-y-4">
                {historyOrders.length === 0 ? <p className="text-center text-gray-500 py-6">Nenhum pedido concluído nesta data.</p> : 
                  historyOrders.map(order => (
                    <div key={order.id} className="bg-[#2a2a2a] p-4 rounded-xl border border-gray-700">
                      <div className="flex justify-between items-start mb-3 border-b border-gray-600 pb-3">
                        <div>
                          <p className="font-bold text-white text-lg">{order.table === 'Balcão' ? 'Balcão' : `Mesa ${order.table}`} <span className="text-sm text-gray-400 ml-2">#{order.id}</span></p>
                          <p className="text-xs text-gray-400 mt-1">{new Date(order.timestamp).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})} • {order.items.length} itens</p>
                        </div>
                        <div><span className="text-green-500 font-bold bg-green-900/30 px-3 py-1 rounded-full text-xs">Entregue</span></div>
                      </div>
                      <div className="space-y-2 mb-3">
                        {order.items.map((item, i) => (
                          <div key={i} className="text-gray-300 text-sm">
                            <div className="flex justify-between">
                              <p><span className="font-bold text-white">1x {item.name}</span></p>
                              <p>R$ {getOrderItemTotal(item).toFixed(2)}</p>
                            </div>
                            {item.adicionais && item.adicionais.length > 0 && <p className="text-xs text-gray-500 pl-4">{item.adicionais.map(a => `+ ${a.name}`).join(', ')}</p>}
                            {item.observation && <p className="text-xs text-yellow-500 pl-4 italic">Obs: {item.observation}</p>}
                          </div>
                        ))}
                      </div>
                      <div className="mt-3 pt-3 border-t border-gray-600 flex justify-between items-center">
                        <span className="text-gray-400 text-sm font-bold">Total do Pedido:</span>
                        <span className="text-white font-black">R$ {getOrderTotal(order.items).toFixed(2)}</span>
                      </div>
                    </div>
                  ))
                }
              </div>
            </div>
          )}

          {activeTab === 'produtos' && (
            <div className="max-w-3xl mx-auto bg-[#1e1e1e] p-6 rounded-xl space-y-8">
              
              {/* GESTÃO DE PRODUTOS DO CARDÁPIO */}
              <div>
                <h2 className="text-xl font-bold border-b border-gray-700 pb-2 mb-4 text-white">Gestão do Cardápio</h2>
                {menuData.map((cat, catIdx) => (
                  <div key={catIdx} className="mb-6"><h3 className="text-lg font-bold text-[#d32f2f] mb-3">{cat.title}</h3>
                    <div className="space-y-3">
                      {cat.items.map((item, itemIdx) => (
                        <div key={item.id} className="bg-[#2a2a2a] p-3 rounded-lg flex justify-between items-center border border-gray-700">
                          <div><p className="font-bold text-white">{item.name}</p><p className="text-[#d32f2f] font-bold text-sm">R$ {Number(item.price).toFixed(2)}</p></div>
                          <button onClick={() => setEditItem({ catIdx, itemIdx, data: {...item} })} className="bg-gray-700 hover:bg-gray-600 p-2 rounded text-white"><IconEdit /></button>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>

              {/* GESTÃO DE MARCAS DE REFRIGERANTE (FINAL DA PÁGINA) */}
              <div className="bg-[#2a2a2a] p-4 rounded-xl border border-gray-700">
                <h2 className="text-xl font-bold text-white mb-2">Gerenciar Marcas de Refrigerante</h2>
                <p className="text-xs text-gray-400 mb-4">Adicione ou remova as marcas que aparecem ao pedir refrigerantes.</p>
                <div className="flex flex-col sm:flex-row gap-2 mb-4">
                  <input type="text" placeholder="Ex: Sprite, Guaraná..." value={newBrandName} onChange={e => setNewBrandName(e.target.value)} className="flex-1 bg-[#121212] text-white border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-[#d32f2f]" />
                  <button onClick={handleAddBrand} className="bg-[#d32f2f] hover:bg-red-700 text-white font-bold px-6 py-3 rounded-lg shrink-0">Adicionar</button>
                </div>
                <div className="flex flex-wrap gap-2">
                  {refrigBrands.map(brand => (
                    <div key={brand} className="bg-[#1e1e1e] border border-gray-700 px-3 py-2 rounded-lg flex items-center gap-2">
                      <span className="font-bold text-sm">{brand}</span>
                      <button onClick={() => handleDeleteBrand(brand)} className="text-red-400 hover:text-red-300 font-bold">&times;</button>
                    </div>
                  ))}
                </div>
              </div>

              {editItem && (
                <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
                  <div className="bg-[#1e1e1e] w-full max-w-md rounded-2xl p-6 shadow-2xl border border-gray-800">
                    <h3 className="text-xl font-bold text-white mb-4">Editar Produto</h3>
                    <div className="space-y-4">
                      <div><label className="text-gray-400 text-sm block mb-1">Nome:</label><input type="text" value={editItem.data.name} onChange={e => setEditItem({...editItem, data: {...editItem.data, name: e.target.value}})} className="w-full bg-[#121212] text-white border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-[#d32f2f]" /></div>
                      <div><label className="text-gray-400 text-sm block mb-1">Descrição:</label><textarea value={editItem.data.desc || ''} onChange={e => setEditItem({...editItem, data: {...editItem.data, desc: e.target.value}})} className="w-full bg-[#121212] text-white border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-[#d32f2f]" rows="2"></textarea></div>
                      <div><label className="text-gray-400 text-sm block mb-1">Preço (R$):</label><input type="number" value={editItem.data.price} onChange={e => setEditItem({...editItem, data: {...editItem.data, price: parseFloat(e.target.value) || 0}})} className="w-full bg-[#121212] text-white border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-[#d32f2f]" /></div>
                    </div>
                    <div className="flex gap-3 mt-6">
                      <button onClick={() => setEditItem(null)} className="flex-1 bg-gray-700 text-white font-bold py-3 rounded-lg hover:bg-gray-600 transition-colors">Cancelar</button>
                      <button onClick={saveProductEdit} className="flex-1 bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-500 transition-colors">Salvar</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {activeTab === 'mesas' && (
            <div className="max-w-2xl mx-auto bg-[#1e1e1e] p-6 rounded-xl">
              <h2 className="text-xl font-bold border-b border-gray-700 pb-2 mb-4 text-white">Cadastrar Mesas & QR Code</h2>
              <div className="flex flex-col sm:flex-row gap-3 mb-8">
                <input type="number" placeholder="Número da Mesa" className="w-full sm:flex-1 bg-[#121212] text-white border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-[#d32f2f]" value={newTableNumber} onChange={e => setNewTableNumber(e.target.value)} />
                <button onClick={handleAddTable} className="w-full sm:w-auto bg-[#d32f2f] hover:bg-red-700 font-bold px-6 py-3 rounded-lg text-white transition-colors">Gerar QR</button>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {tables.map(t => (
                  <div key={t.number} className="bg-[#2a2a2a] p-4 rounded-xl flex flex-col items-center border border-gray-700">
                    <h3 className="font-black text-xl mb-3 text-white">Mesa {t.number}</h3>
                    <div className="bg-white p-2 rounded-lg mb-3"><img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(t.url)}`} alt={`QR Mesa ${t.number}`} /></div>
                    <button onClick={() => downloadQR(t.number, t.url)} className="flex items-center justify-center gap-2 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg mb-2"><IconDownload /> Baixar QR</button>
                    <button onClick={() => handleDeleteTable(t.number)} className="text-red-500 hover:text-red-400 text-sm font-bold mt-1">Remover Mesa</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="fixed bottom-0 left-0 w-full bg-[#1a1a1a] border-t border-gray-800 flex justify-around p-2 z-20">
            <button onClick={() => setActiveTab('pedidos')} className={`flex flex-col items-center gap-1 ${activeTab === 'pedidos' ? 'text-[#d32f2f]' : 'text-gray-500'}`}><IconList /><span className="text-[10px] font-bold">Cozinha</span></button>
            <button onClick={() => setActiveTab('caixa')} className={`flex flex-col items-center gap-1 ${activeTab === 'caixa' ? 'text-[#d32f2f]' : 'text-gray-500'}`}><IconCash /><span className="text-[10px] font-bold">Caixa</span></button>
            <button onClick={() => setActiveTab('novo-pedido')} className={`flex flex-col items-center gap-1 ${activeTab === 'novo-pedido' ? 'text-[#d32f2f]' : 'text-gray-500'}`}><IconClipboard /><span className="text-[10px] font-bold">Lançar</span></button>
            <button onClick={() => setActiveTab('historico')} className={`flex flex-col items-center gap-1 ${activeTab === 'historico' ? 'text-[#d32f2f]' : 'text-gray-500'}`}><IconHistory /><span className="text-[10px] font-bold">Histórico</span></button>
            <button onClick={() => setActiveTab('produtos')} className={`flex flex-col items-center gap-1 ${activeTab === 'produtos' ? 'text-[#d32f2f]' : 'text-gray-500'}`}><IconBox /><span className="text-[10px] font-bold">Produtos</span></button>
            <button onClick={() => setActiveTab('mesas')} className={`flex flex-col items-center gap-1 ${activeTab === 'mesas' ? 'text-[#d32f2f]' : 'text-gray-500'}`}><IconQrCode /><span className="text-[10px] font-bold">Mesas</span></button>
          </div>
        </div>
      );
    }

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const mesaParam = urlParams.get('mesa');
      const [route, setRoute] = useState(mesaParam ? 'client' : 'home');
      const [tableNumber, setTableNumber] = useState(mesaParam || '1');
      return (
        <div className="font-sans antialiased text-white">
          {route === 'home' && <Home setRoute={setRoute} setTableNumber={setTableNumber} />}
          {route === 'client' && <ClientMenu setRoute={setRoute} tableNumber={tableNumber} />}
          {route === 'admin' && <AdminPanel setRoute={setRoute} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
