    // Tela Inicial
    function Home({ setRoute, setTableNumber }) {
      const [adminPassword, setAdminPassword] = useState('');
      const [error, setError] = useState('');

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6">
          <div className="bg-[#1e1e1e] p-8 rounded-2xl shadow-xl w-full max-w-md text-center">

              <p className="text-gray-400 text-sm tracking-[0.3em] mb-8">XISERIA • CIA</p>
            </div>
            
            <button onClick={() => { setTableNumber('1'); setRoute('client'); }}
              className="w-full bg-[#d32f2f] hover:bg-red-700 text-white p-4 rounded-xl font-bold flex items-center justify-center gap-2 mb-4">

                className="w-full bg-[#121212] text-white border border-gray-700 p-3 rounded-lg mb-3 text-center"
                value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} />
              {error && <p className="text-red-500 text-sm mb-3">{error}</p>}
              <button onClick={() => adminPassword === '1234' ? setRoute('admin') : setError('Senha incorreta!')} className="w-full bg-gray-700 hover:bg-gray-600 text-white p-3 rounded-lg font-bold">
                Entrar no Painel
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Tela do Cliente
    function ClientMenu({ tableNumber, setRoute }) {
      const [cart, setCart] = useState([]);
      const [orderSent, setOrderSent] = useState(false);
      const [addonModalItem, setAddonModalItem] = useState(null);
      const [selectedAddons, setSelectedAddons] = useState([]);

      const handleOpenAddons = (item) => {
        setAddonModalItem(item);
        setSelectedAddons([]);
      };

      const toggleAddon = (addon) => {
        if (selectedAddons.find(a => a.id === addon.id)) {
          setSelectedAddons(selectedAddons.filter(a => a.id !== addon.id));
        } else {
          setSelectedAddons([...selectedAddons, addon]);
        }
      };

      const confirmItemToCart = () => {
        setCart([...cart, { ...addonModalItem, cartId: Date.now(), adicionais: selectedAddons }]);
        setAddonModalItem(null);
      };

      const getCartTotal = () => cart.reduce((total, item) => {
        const adTotal = item.adicionais ? item.adicionais.reduce((sum, add) => sum + add.price, 0) : 0;
        return total + item.price + adTotal;
      }, 0);

      const sendOrder = () => {
        const newOrder = {
          id: Math.random().toString(36).substr(2, 5).toUpperCase(),
          table: tableNumber,
          items: cart,
          timestamp: Date.now(),
          status: 'pendente'
        };
        const existingOrders = JSON.parse(localStorage.getItem('raiz_orders')) || [];
        localStorage.setItem('raiz_orders', JSON.stringify([...existingOrders, newOrder]));
        setOrderSent(true);
        setCart([]);
      };

      if (orderSent) return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
          <div className="bg-green-600 p-6 rounded-full mb-6"><IconCheck /></div>
          <h2 className="text-3xl font-bold mb-2">Pedido Enviado!</h2>
          <p className="text-gray-400 mb-8">A cozinha já está a preparar o seu pedido.</p>
          <button onClick={() => setOrderSent(false)} className="bg-[#d32f2f] px-8 py-3 rounded-lg font-bold">Novo pedido</button>
        </div>
      );

      return (
        <div className="pb-24">
          <header className="bg-[#1a1a1a] p-4 sticky top-0 z-10 shadow-md flex justify-between items-center border-b border-red-900">
            <button onClick={() => setRoute('home')} className="text-gray-400"><IconArrowLeft /></button>
            <div className="text-center flex flex-col items-center">
              <img src="./Logo.png" alt="RAIZ" className="h-8 mx-auto object-contain" onError={handleImageError} />
              <div style={{ display: 'none' }}><h1 className="text-xl font-black text-[#d32f2f]">RAIZ</h1></div>
              <p className="text-gray-400 text-xs mt-1">Mesa {tableNumber}</p>
            </div>
            <div className="w-6"></div>
          </header>

          <div className="p-4 space-y-8 max-w-2xl mx-auto">
            {menuCategories.map((cat, idx) => (
              <div key={idx}>
                <h2 className="text-xl font-bold border-b-2 border-[#d32f2f] pb-2 mb-4">{cat.title}</h2>
                <div className="space-y-4">
                  {cat.items.map(item => (
                    <div key={item.id} className="bg-[#1e1e1e] p-4 rounded-xl flex justify-between items-center shadow-lg">
                      <div className="flex-1 pr-4">
                        <h3 className="font-bold text-lg leading-tight">{item.name}</h3>
                        {item.desc && <p className="text-gray-400 text-xs mt-1 leading-snug">{item.desc}</p>}
                        <p className="text-[#d32f2f] font-bold mt-2">R$ {item.price.toFixed(2)}</p>
                      </div>
                      <button onClick={() => handleOpenAddons(item)} className="bg-[#2a2a2a] hover:bg-[#d32f2f] p-3 rounded-lg transition-colors"><IconPlus /></button>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {/* Modal de Adicionais */}
          {addonModalItem && (
            <div className="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4">
              <div className="bg-[#1e1e1e] w-full max-w-md rounded-2xl p-6 shadow-2xl max-h-[80vh] overflow-y-auto border border-gray-800">
                <div className="flex justify-between items-start border-b border-gray-700 pb-4 mb-4">
                  <div>
                    <h3 className="text-xl font-bold text-[#d32f2f]">{addonModalItem.name}</h3>
                    <p className="text-gray-400 text-sm">Deseja incluir adicionais?</p>
                  </div>
                  <button onClick={() => setAddonModalItem(null)} className="text-gray-500 hover:text-white text-2xl leading-none">&times;</button>
                </div>
                
                <div className="space-y-3 mb-6">
                  {aditionalItems.map(addon => (
                    <label key={addon.id} className="flex items-center justify-between bg-[#2a2a2a] p-3 rounded-lg cursor-pointer">
                      <div className="flex items-center gap-3">
                        <input type="checkbox" className="w-5 h-5 accent-[#d32f2f]" 
                          checked={!!selectedAddons.find(a => a.id === addon.id)} 
                          onChange={() => toggleAddon(addon)} />
                        <span className="font-bold">{addon.name}</span>
                      </div>
                      <span className="text-[#d32f2f]">+ R$ {addon.price.toFixed(2)}</span>
                    </label>
                  ))}
                </div>
                
                <button onClick={confirmItemToCart} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl text-lg transition-colors">
                  Confirmar e Adicionar
                </button>
              </div>
            </div>
          )}

          {cart.length > 0 && (
            <div className="fixed bottom-0 w-full bg-[#1e1e1e] p-4 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-20">
              <div className="max-w-2xl mx-auto flex justify-between items-center">
                <div>
                  <p className="text-gray-400 text-sm">{cart.length} item(s)</p>
                  <p className="font-bold text-xl">R$ {getCartTotal().toFixed(2)}</p>
                </div>
                <button onClick={sendOrder} className="bg-[#d32f2f] px-6 py-3 rounded-xl font-bold flex gap-2"><IconCart /> Enviar Pedido</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Tela Admin
    function AdminPanel({ setRoute }) {
      const [activeTab, setActiveTab] = useState('pedidos');
      const [orders, setOrders] = useState([]);
      const [now, setNow] = useState(Date.now());
      
      const [tables, setTables] = useState(() => JSON.parse(localStorage.getItem('raiz_tables')) || []);
      const [newTableNumber, setNewTableNumber] = useState('');

      useEffect(() => {
        if (activeTab !== 'pedidos') return;
        const timer = setInterval(() => {
          setNow(Date.now());
          const saved = JSON.parse(localStorage.getItem('raiz_orders')) || [];
          setOrders(saved.filter(o => o.status === 'pendente'));
        }, 1000);
        return () => clearInterval(timer);
      }, [activeTab]);

      const completeOrder = (id) => {
        const saved = JSON.parse(localStorage.getItem('raiz_orders')) || [];
        localStorage.setItem('raiz_orders', JSON.stringify(saved.map(o => o.id === id ? { ...o, status: 'concluido' } : o)));
        setOrders(saved.map(o => o.id === id ? { ...o, status: 'concluido' } : o).filter(o => o.status === 'pendente'));
      };

      const getTime = (ts) => {
        const diff = Math.floor((now - ts) / 1000);
        return `${Math.floor(diff / 60).toString().padStart(2, '0')}:${(diff % 60).toString().padStart(2, '0')}`;
      };

      const handleAddTable = () => {
        if (!newTableNumber) return;
        const url = `${window.location.origin}${window.location.pathname}?mesa=${newTableNumber}`;
        const updatedTables = [...tables, { number: newTableNumber, url }];
        setTables(updatedTables);
        localStorage.setItem('raiz_tables', JSON.stringify(updatedTables));
        setNewTableNumber('');
      };

      const handleDeleteTable = (num) => {
        const updated = tables.filter(t => t.number !== num);
        setTables(updated);
        localStorage.setItem('raiz_tables', JSON.stringify(updated));
      };

      return (
        <div className="pb-24 p-6 min-h-screen">
          <header className="flex justify-between items-center mb-6 bg-[#1e1e1e] p-4 rounded-xl">
            <button onClick={() => setRoute('home')} className="text-gray-400"><IconArrowLeft /></button>
            <h1 className="text-2xl font-black text-white">ADMIN</h1>
            <div className="bg-[#d32f2f] px-3 py-1 rounded-full text-sm font-bold animate-pulse">Ativo</div>
          </header>

          {activeTab === 'pedidos' && (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {orders.length === 0 ? (
                <div className="col-span-full text-center text-gray-500 mt-10"><p className="text-xl">Nenhum pedido na fila.</p></div>
              ) : (
                orders.map(order => (
                  <div key={order.id} className="bg-[#1e1e1e] border-l-4 border-[#d32f2f] rounded-xl p-5 shadow-xl flex flex-col">
                    <div className="flex justify-between border-b border-gray-700 pb-3 mb-3">
                      <div>
                        <h2 className="text-2xl font-black">Mesa {order.table}</h2>
                        <p className="text-gray-400 text-sm">#{order.id}</p>
                      </div>
                      <div className="bg-[#2a2a2a] text-[#d32f2f] px-3 py-1 rounded-lg text-xl font-bold flex items-center gap-2"><IconClock /> {getTime(order.timestamp)}</div>
                    </div>
                    <div className="flex-1 space-y-3 mb-4">
                      {order.items.map((item, i) => (
                        <div key={i} className="text-white">
                          <p className="font-bold text-lg">• 1x {item.name}</p>
                          {item.adicionais && item.adicionais.map((add, idx) => (
                            <p key={idx} className="text-sm text-gray-400 pl-4">+ {add.name}</p>
                          ))}
                        </div>
                      ))}
                    </div>
                    <button onClick={() => completeOrder(order.id)} className="w-full bg-green-600 py-4 rounded-lg font-bold flex justify-center gap-2 text-lg"><IconCheckCircle /> Entregar</button>
                  </div>
                ))
              )}
            </div>
          )}

          {activeTab === 'mesas' && (
            <div className="max-w-2xl mx-auto bg-[#1e1e1e] p-6 rounded-xl">
              <h2 className="text-xl font-bold border-b border-gray-700 pb-2 mb-4">Cadastrar Mesas & QR Code</h2>
              <div className="flex gap-2 mb-8">
                <input type="number" placeholder="Número da Mesa" className="flex-1 bg-[#121212] border border-gray-700 p-3 rounded-lg"
                  value={newTableNumber} onChange={e => setNewTableNumber(e.target.value)} />
                <button onClick={handleAddTable} className="bg-[#d32f2f] font-bold px-6 py-3 rounded-lg text-white">Gerar QR</button>
              </div>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {tables.map(t => (
                  <div key={t.number} className="bg-[#2a2a2a] p-4 rounded-xl flex flex-col items-center border border-gray-700">
                    <h3 className="font-black text-xl mb-3">Mesa {t.number}</h3>
                    <div className="bg-white p-2 rounded-lg mb-3">
                      <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(t.url)}`} alt={`QR Mesa ${t.number}`} />
                    </div>
                    <button onClick={() => handleDeleteTable(t.number)} className="text-red-500 text-sm font-bold mt-2">Remover Mesa</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="fixed bottom-0 left-0 w-full bg-[#1a1a1a] border-t border-gray-800 flex justify-around p-3 z-20">
            <button onClick={() => setActiveTab('pedidos')} className={`flex flex-col items-center gap-1 ${activeTab === 'pedidos' ? 'text-[#d32f2f]' : 'text-gray-500'}`}>
              <IconList /><span className="text-xs font-bold">Pedidos</span>
            </button>
            <button onClick={() => setActiveTab('mesas')} className={`flex flex-col items-center gap-1 ${activeTab === 'mesas' ? 'text-[#d32f2f]' : 'text-gray-500'}`}>
              <IconQrCode /><span className="text-xs font-bold">Mesas & QR</span>
            </button>
          </div>
        </div>
      );
    }

    // App Wrapper com Roteamento por URL
    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const mesaParam = urlParams.get('mesa');
      
      const [route, setRoute] = useState(mesaParam ? 'client' : 'home');
      const [tableNumber, setTableNumber] = useState(mesaParam || '');

      return (
        <div className="font-sans antialiased text-white">
          {route === 'home' && <Home setRoute={setRoute} setTableNumber={setTableNumber} />}
          {route === 'client' && <ClientMenu setRoute={setRoute} tableNumber={tableNumber} />}
          {route === 'admin' && <AdminPanel setRoute={setRoute} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
